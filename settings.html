<div class="feedpros-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>feedPros</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label" for="feedpros-use-profile">
                <input id="feedpros-use-profile" type="checkbox">
                <span>Use specified Connection Profile</span>
            </label>
            <select id="feedpros-profile" class="text_pole" aria-label="Connection Profile"></select>
            <label class="checkbox_label" for="feedpros-use-preset">
                <input id="feedpros-use-preset" type="checkbox">
                <span>Use specified API Preset</span>
            </label>
            <select id="feedpros-preset" class="text_pole" aria-label="API Preset"></select>
            <small>Selections are applied only while Feedback is generated.</small>
        </div>
    </div>
</div>
